<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Đăng nhập quản trị | Quản trị Hải Đăng Digital</title>
<link rel="icon" href="../assets/p/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>window.ROOT='../';</script>
</head>
<body class="adm-login-page">
<main class="adm-login">
  <form class="card" data-staff-login>
    <div class="adm-brand"><span class="logo-mark" aria-hidden="true">H</span><span><b>Hải Đăng Digital</b><small>Đăng nhập quản trị</small></span></div>
    <label class="field"><span>Tài khoản</span><select name="staff" data-staff-select></select></label>
    <label class="field"><span>Mật khẩu</span><input name="password" type="password" required autocomplete="current-password"></label>
    <p class="form-error" data-login-error hidden role="alert">Sai mật khẩu.</p>
    <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
<p class="hint"><svg class="i i-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>Trang mẫu: mật khẩu là <b>demo</b>. Khi chạy thật, trang quản trị cần máy chủ và tài khoản thật.</p>  </form>
</main>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin.js"></script>
