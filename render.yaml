# Blueprint của Render cho API Pickory. Tạo service bằng Dashboard > New > Blueprint, rồi chọn repo này.
services:
  - type: web
    name: pickory-api
    runtime: docker
    # Dockerfile cần cả `apps/frontend`, nên context là gốc repo.
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    branch: main
    # Gói free dùng cho giai đoạn demo. Service ngủ sau 15 phút không có request.
    # UptimeRobot gọi `/api/health` 5 phút một lần, nên service không ngủ. Xem mục 7 của `docs/deployment-overview.md`.
    plan: free
    # Đặt cùng vùng với project Supabase để giảm độ trễ tới DB.
    region: singapore
    healthCheckPath: /api/health
    # Gói free không có pre-deploy. Chạy `db:migrate` từ máy dev trước khi đẩy code có migration mới.
    # Khi chuyển sang gói trả phí, thêm dòng `preDeployCommand: dotnet Pickory.Api.dll db:migrate`.
    autoDeployTrigger: commit
    # Thay đổi ở web cũng phải build lại API. `index.html` trong image phải khớp asset trên Vercel.
    buildFilter:
      paths:
        - apps/backend/src/**
        - apps/backend/Dockerfile
        - apps/backend/Directory.Build.props
        - apps/backend/Directory.Packages.props
        - apps/frontend/**
        - .dockerignore
    envVars:
      # Các biến có `sync: false` không có giá trị trong repo. Render hỏi giá trị khi tạo Blueprint.
      - key: DATABASE_URL
        sync: false
      # Supabase Session pooler gói free cho 15 kết nối cùng lúc. Giới hạn này áp cho cả tiến trình API, gồm mọi module và worker nền.
      # API giữ tối đa 5, để hai instance trong lúc deploy dùng tối đa 10 kết nối.
      - key: DATABASE_POOL_MAX
        value: "5"
      # Trang chủ gửi 11 request tới danh sách sản phẩm và cây danh mục. Gói free xử lý chậm khi nhiều request song song.
      # Cache 30 giây trong bộ nhớ API, và API xóa cache ngay khi admin đổi catalog hoặc tồn kho.
      - key: CATALOG_CACHE_SECONDS
        value: "30"
      # Hai biến này là domain Vercel. Cookie phiên và callback Google phải ở cùng origin với web.
      - key: WEB_ORIGIN
        sync: false
      - key: API_BASE_URL
        sync: false
      # Request đi qua proxy của Vercel rồi proxy của Render. Kiểm tra lại số hop sau lần triển khai đầu.
      - key: TRUST_PROXY
        value: "2"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Giai đoạn demo dùng tài khoản sandbox của GHN, nên đơn không phải đơn thật.
      # Khi có tài khoản GHN production, đổi giá trị sang `https://online-gateway.ghn.vn`.
      - key: GHN_API_BASE
        value: https://dev-online-gateway.ghn.vn
      - key: GHN_TOKEN
        sync: false
      - key: GHN_SHOP_ID
        sync: false
      - key: GHN_WEBHOOK_SECRET
        sync: false
      # Khóa SePay gửi kèm webhook tiền về. Production thiếu biến này thì API dừng khi khởi động.
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      # Mở tài liệu API chỉ xem tại `/api/docs`. Người xem đọc được route và schema, nhưng không gửi request từ trang docs.
      - key: API_DOCS_ENABLED
        value: "1"
      # Cho gọi thử API từ trang docs bằng nút "Try it out". Request vẫn qua kiểm quyền như mọi request khác.
      - key: API_DOCS_INTERACTIVE
        value: "1"
