# Blueprint của Render cho API Pickory. Tạo service bằng Dashboard > New > Blueprint, rồi chọn repo này.
services:
  - type: web
    name: pickory-api
    runtime: docker
    # Dockerfile cần cả `apps/frontend`, nên context là gốc repo.
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    branch: main
    # Gói free dùng cho giai đoạn demo. Service ngủ sau 15 phút không có request, nên worker nền dừng và webhook GHN chờ khởi động lại.
    plan: free
    # Đặt cùng vùng với project Supabase để giảm độ trễ tới DB.
    region: singapore
    healthCheckPath: /api/health
    # Gói free không có pre-deploy. Chạy `db:migrate` từ máy dev trước khi đẩy code có migration mới.
    # Khi chuyển sang gói trả phí, thêm dòng `preDeployCommand: dotnet Pickory.Api.dll db:migrate`.
    autoDeployTrigger: commit
    # Thay đổi ở web cũng phải build lại API. `index.html` trong image phải khớp asset trên Vercel.
    buildFilter:
      paths:
        - apps/backend/src/**
        - apps/backend/Dockerfile
        - apps/backend/Directory.Build.props
        - apps/backend/Directory.Packages.props
        - apps/frontend/**
        - .dockerignore
    envVars:
      # Các biến có `sync: false` không có giá trị trong repo. Render hỏi giá trị khi tạo Blueprint.
      - key: DATABASE_URL
        sync: false
      # Hai biến này là domain Vercel. Cookie phiên và callback Google phải ở cùng origin với web.
      - key: WEB_ORIGIN
        sync: false
      - key: API_BASE_URL
        sync: false
      # Request đi qua proxy của Vercel rồi proxy của Render. Kiểm tra lại số hop sau lần triển khai đầu.
      - key: TRUST_PROXY
        value: "2"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Gateway production của GHN. Mặc định trong code là sandbox.
      - key: GHN_API_BASE
        value: https://online-gateway.ghn.vn
      - key: GHN_TOKEN
        sync: false
      - key: GHN_SHOP_ID
        sync: false
      - key: GHN_WEBHOOK_SECRET
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: AI_MONTHLY_BUDGET_USD
        value: "30"
      - key: AI_CHAT_DAILY_LIMIT_USER
        value: "50"
      - key: AI_CHAT_DAILY_LIMIT_ANON
        value: "15"
